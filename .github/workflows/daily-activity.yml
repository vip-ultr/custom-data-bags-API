name: Daily Activity Commit

on:
  schedule:
    - cron: '0 2 * * *'  # Runs daily at 2 AM UTC
  workflow_dispatch:     # Allows manual trigger

jobs:
  daily-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Update activity tracker
        run: |
          echo "Last updated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > .activity-tracker
          cat .activity-tracker

      - name: Commit and push
        run: |
          git add .activity-tracker
          git commit -m "chore: daily activity update - $(date -u '+%Y-%m-%d')" || echo "No changes to commit"
          git push origin HEAD:main || git push origin HEAD:master || git push origin HEAD:$(git rev-parse --abbrev-ref HEAD)
